name: docs-check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run documentation checker
        run: python3 scripts/docs/check_docs.py
      - name: Run backend traceability checker
        run: python3 scripts/docs/check_backend_traceability.py
